<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Party</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Login & Public Lobby Overlay (WP-104 & WP-106) -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>Watch Party</h2>
            <div id="login-alert" style="display:none; padding: 8px; border-radius: 4px; font-size: 13px; text-align: center;"></div>
            
            <input type="text" id="username-input" class="login-input" placeholder="Your Name" required>
            <input type="text" id="room-input" class="login-input" placeholder="Room Code (e.g., 1234)" required>
            
            <label class="checkbox-label" title="Only applies when creating a new room">
                <input type="checkbox" id="public-checkbox"> Make Public (when creating)
            </label>

            <div style="display: flex; gap: 10px;">
                <button id="btn-create-room" class="btn-primary" style="flex: 1;">Create Room</button>
                <button id="btn-join-room" class="control-btn" style="flex: 1; font-weight: bold; font-size: 15px;">Join Room</button>
            </div>

            <div id="public-rooms-section">
                <h4>Active Public Rooms</h4>
                <div id="public-rooms-list">
                    <div style="font-size: 12px; color: #666;">No public rooms active.</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Header Status -->
    <div class="status-box">
        <span id="status">Waiting to join room...</span>
    </div>
    <!-- Host Knock Approval Banner -->
    <div id="knock-container" style="width: 640px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px;"></div>
    <!-- Live Debounced Search (WP-102) -->
    <div id="search-container">
        <input type="text" id="search-input" placeholder="Search YouTube to add to queue...">
    </div>
    <div id="search-results"></div>

    <!-- Video Queue UI (WP-105) -->
    <div id="queue-container">
        <h4 style="margin: 0 0 6px 0;">Up Next</h4>
        <div id="queue-list" style="font-size: 13px; color: #aaa;">Queue is empty.</div>
    </div>

    <!-- Main Content Layout -->
    <div id="main-layout">
        <!-- Video Player -->
        <div id="video-wrapper">
            <div id="player"></div>
            <div id="custom-controls">
                <button id="btn-play-pause" class="icon-btn">▶</button>
                <input type="range" id="seek-bar" value="0" min="0" max="100" step="0.1">
                <span id="time-display">0:00 / 0:00</span>
                <div class="control-group">
                    <button id="btn-mute" class="icon-btn">🔇</button>
                    <input type="range" id="volume-slider" value="0" min="0" max="100">
                </div>
            </div>
        </div>

        <!-- Live Chat Sidebar (WP-103) -->
        <div id="chat-container">
            <div id="chat-messages"></div>
            <div id="chat-input-container">
                <input type="text" id="chat-input" placeholder="Type a message...">
                <button id="btn-send-chat" class="control-btn">Send</button>
            </div>
        </div>
    </div>

    <!-- External Libraries & App Script -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="app.js"></script>
</body>
</html>
